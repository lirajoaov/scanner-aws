name: Testes

on:
  push:
  pull_request:

# Os testes usam a AWS simulada (moto); este workflow não precisa de credenciais.
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: pytest -q
